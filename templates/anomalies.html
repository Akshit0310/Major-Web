<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Combined CSS */

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(45deg, #15222e, #8100E0);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 1s ease;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 800px;
            width: 90%;
            animation: slideUp 1s ease;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .card {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 20px;
            margin: 10px 0;
            border-radius: 15px;
        }

        .bar-chart {
            margin-top: 30px;
        }

        table {
            width: 100%;
            min-width: 1000px;
            border-collapse: collapse;
            background: rgb(200, 136, 136);
            color: #000000;
            border-radius: 10px;
            overflow: hidden;
        }


        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .table-container {
            max-height: 500px;  /* increased from 300px */
            max-width: 1800px;  /* set a max-width */
            overflow: auto;     /* allow both X and Y scrolling */
            margin: 10px auto;  /* center align */
        }



        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }

        /* New Speedometer (CSS Gauge) */
        .gauge {
            font-family: Arial, Helvetica, sans-serif;
            background: #e7e7e7;
            box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.09), 0 0 35px 5px rgba(255, 255, 255, 0.29);
            width: 200px;
            height: 100px;
            border-radius: 100px 100px 0 0;
            position: relative;
            overflow: hidden;
            margin: 30px auto;
            -webkit-transform-style: flat;
            -webkit-transform: translateZ(0px);
        }

        .gauge-center {
            content: '';
            color: #fff;
            width: 60%;
            height: 60%;
            background: #15222E;
            border-radius: 100px 100px 0 0;
            position: absolute;
            box-shadow: 0 -13px 15px -10px rgba(0, 0, 0, 0.28);
            right: 21%;
            bottom: 0;
            color: #fff;
            text-align: center;
        }

        .gauge-center .label, .gauge-center .number {
            display: block;
            width: 100%;
            text-align: center;
        }

        .gauge-center .label {
            font-size: 0.75em;
            opacity: 0.6;
            margin: 1.1em 0 0.3em 0;
        }

        .gauge-center .number {
            font-size: 1.2em;
        }

        .needle {
            width: 78px;
            height: 7px;
            background: #15222E;
            border-bottom-left-radius: 100%;
            border-bottom-right-radius: 5px;
            border-top-left-radius: 100%;
            border-top-right-radius: 5px;
            position: absolute;
            bottom: 4px;
            left: 20px;
            transform-origin: 100% 4px;
            transform: rotate(0deg); /* Will be dynamically updated */
            box-shadow: 0 2px 2px 1px rgba(0, 0, 0, 0.38);
        }

        .slice-colors .st {
            position: absolute;
            bottom: 0;
            width: 60px;
            height: 0;
            border-bottom: 80px solid #000;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
        }

        .slice-colors .st:nth-child(1) {
            border-bottom-color: #EB8916;
            left: -5px;
        }

        .slice-colors .st:nth-child(2) {
            border-bottom-color: #15C63C;
            transform: rotate(145deg);
            transform-origin: right;
            top: 12px;
            left: -30px;
        }

        .slice-colors .st:nth-child(3) {
            border-bottom-color: #15C63C;
            transform: rotate(225deg);
            transform-origin: right;
            top: -50px;
            left: 25px;
        }

        .slice-colors .st:nth-child(4) {
            border-bottom-color: #D74141;
            transform: rotate(35deg);
            transform-origin: right;
            right: -10px;
            bottom: -28px;
        }

        .slice-colors .st:nth-child(5) {
            border-bottom-color: #D74141;
            transform: rotate(28deg);
            transform-origin: right;
            right: -10px;
            bottom: -50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Anomaly Rows</h1>

        <!-- New CSS Gauge -->
       

        

    


    

        <div class="card table-container">
            <h3>Detected Anomalies (Raw Rows)</h3>
            {{ anomaly_rows | safe }}
        </div>
    </div>

 

</body>
</html>
