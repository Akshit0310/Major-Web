<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Anomaly Detection Results</h1>

        <div class="card">
            <h2>Anomalous Traffic: {{ anomaly_percent }}%</h2>
        </div>

        <div class="card bar-chart">
            <canvas id="classChart"></canvas>
        </div>

        <div class="card table-container">
            <h3>Detected Anomalies (Raw Rows)</h3>
            {{ anomaly_rows | safe }}
        </div>
    </div>

    <script>
        const labels = {{ class_labels | tojson }};
        const data = {{ class_percents | tojson }};

        const ctx = document.getElementById('classChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: '% of Traffic',
                    data: data,
                    backgroundColor: 'rgba(255, 99, 132, 0.6)',
                    borderColor: 'rgba(255, 99, 132, 1)',
                    borderWidth: 1,
                    borderRadius: 10
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            color: "#fff"
                        }
                    },
                    x: {
                        ticks: {
                            color: "#fff"
                        }
                    }
                },
                plugins: {
                    legend: {
                        labels: {
                            color: "#fff"
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
